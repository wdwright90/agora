[workspace]
members = ["agora-client", "agora-env", "agora-protocol", "agora-server", "agora-sim", "agora-viewer"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
agora-client = { path = "agora-client", default-features = false }
agora-env = { path = "agora-env" }
agora-protocol = { path = "agora-protocol" }
agora-server = { path = "agora-server" }
agora-sim = { path = "agora-sim" }
bevy = { version = "0.19.1", default-features = false, features = ["2d"] }
bevy_ecs = "0.19.1"
bevy_egui = "0.42.0"
bevy_reflect = { version = "0.19.1", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
rand = "0.10.3"
rand_chacha = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
